name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Standardized org-wide required check. See FlowMatrix-AI/eng-governance.
  #
  # This repo publishes the presets every other repo's dependency automation
  # extends, and until now it had no check of its own: `ok` was a trivial
  # always-pass gate. A broken preset does not fail loudly — the repos extending
  # it stop getting updates — so an error here is silent, estate-wide.
  ok:
    name: ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate presets
        run: |
          set -euo pipefail
          # Every root-level JSON is a preset here. Globbed, not listed: a
          # hand-written list is how a new preset ships unvalidated, and the
          # validator only checks STANDARD config filenames when given no
          # paths — which would silently skip default.json and
          # marketing-site.json, the two files that actually matter.
          shopt -s nullglob
          files=(*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no preset files found — this check would pass vacuously"
            exit 1
          fi
          echo "validating: ${files[*]}"
          npx --yes --package renovate@41.0.0 renovate-config-validator --strict "${files[@]}"
